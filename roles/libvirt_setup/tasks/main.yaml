---
# tasks file for libvirt_setup

- name: "Include OS specific variables for libvirt_setup"
  ansible.builtin.include_vars:
    file: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yaml"
        - "{{ ansible_distribution }}.yaml"
      paths:
        - "vars"
  tags:
    - always

- name: Include checks for role variable syntax
  ansible.builtin.include_tasks:
    file: checks-syntax.yaml
  tags:
    - checks
    - checks-syntax

- name: Include checks for OS specific internal role variables
  ansible.builtin.include_tasks:
    file: checks-syntax-os.yaml
  tags:
    - checks
    - checks-syntax-os

- name: Include checks for host configuration
  ansible.builtin.include_tasks:
    file: checks-host-config.yaml
  tags:
    - checks
    - checks-host-config

- name: Stat libvirt data dir
  ansible.builtin.stat:
    path: "{{ libvirt_setup_libvirt_data_dir }}"
  register: libvirt_setup_libvirt_data_dir_stat
  tags:
    - checks

- name: Fail if libvirt data dir exists without 'nocow' attribute set
  ansible.builtin.fail:
    msg: >
      {{ libvirt_setup_libvirt_data_dir }} need to have the 'nocow' attribute
      set on filesystems with Copy-on-Write feature, to mitigate performance
      issues. If you are sure you do not need the 'nocow' attribute, you can
      disable this check by setting 'libvirt_setup_data_dir_check_nocow' to
      false.
  when:
    - libvirt_setup_data_dir_set_nocow
    - data_dir.exists
    - '"nocow" not in data_dir.attributes'
  vars:
    # variable for readability
    data_dir: "{{ libvirt_setup_libvirt_data_dir_stat.stat }}"
  tags:
    - checks

- name: Create libvirt data directory
  ansible.builtin.file:
    path: "{{ libvirt_setup_libvirt_data_dir }}"
    state: directory
    attributes: "{{ '+C' if libvirt_setup_data_dir_set_nocow else omit }}"
    mode: "0755"
    owner: root
    group: root
  become: true
  diff: true

- name: Ensure conflicting packages are not installed
  ansible.builtin.package:
    name: "{{ libvirt_setup_pkgs_absent }}"
    state: absent
    force: true
  become: true

- name: Install libvirt and dependencies
  ansible.builtin.package:
    name: "{{ libvirt_setup_pkgs_present }}"
    state: present
  become: true

- name: Add management users to libvirt group
  ansible.builtin.user:
    name: "{{ user }}"
    groups: libvirt
    append: true
  become: true
  loop: "{{ libvirt_setup_mgm_users }}"
  loop_control:
    loop_var: user

- name: Start and enable libvirtd.service
  ansible.builtin.systemd:
    name: libvirtd.service
    enabled: true
    state: started
  become: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Template libvirt-guests
  ansible.builtin.template:
    src: libvirt-guests.j2
    dest: /etc/conf.d/libvirt-guests
    owner: root
    group: root
    mode: '0644'
  become: true
  diff: true
  notify:
    - Restart libvirt-guests

- name: Start and enable libvirt-guests
  ansible.builtin.systemd:
    name: libvirt-guests.service
    enabled: true
    state: started
  become: true
  ignore_errors: "{{ ansible_check_mode }}"

# End of file
