---
# tasks file for libvirt_setup

- name: "Include OS specific variables for libvirt_setup"
  ansible.builtin.include_vars:
    file: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yaml"
        - "{{ ansible_distribution }}.yaml"
      paths:
        - "vars"
  tags:
    - always

- name: Include checks for role variable syntax
  ansible.builtin.include_tasks:
    file: checks-syntax.yaml
  tags:
    - checks
    - checks-syntax

- name: Include checks for OS specific internal role variables
  ansible.builtin.include_tasks:
    file: checks-syntax-os.yaml
  tags:
    - checks
    - checks-syntax-os

- name: Include checks for host configuration
  ansible.builtin.include_tasks:
    file: checks-host-config.yaml
  tags:
    - checks
    - checks-host-config

- name: Stat libvirt data dir
  ansible.builtin.stat:
    path: "{{ libvirt_setup_libvirt_data_dir }}"
  register: libvirt_setup_libvirt_data_dir_stat
  tags:
    - checks

- name: Fail if libvirt data dir exists without 'nocow' attribute set
  ansible.builtin.fail:
    msg: >
      {{ libvirt_setup_libvirt_data_dir }} need to have the 'nocow' attribute
      set on filesystems with Copy-on-Write feature, to mitigate performance
      issues. If you are sure you do not need the 'nocow' attribute, you can
      disable this check by setting 'libvirt_setup_data_dir_check_nocow' to
      false.
  when:
    - libvirt_setup_data_dir_set_nocow
    - data_dir.exists
    - '"nocow" not in data_dir.attributes'
  vars:
    # variable for readability
    data_dir: "{{ libvirt_setup_libvirt_data_dir_stat.stat }}"
  tags:
    - checks

- name: Include tasks for configuration
  ansible.builtin.include_tasks:
    file: configure.yaml
    apply:
      tags:
        - configure
  tags:
    - configure

# End of file
