---
# tasks file for libvirt

- name: Check if /var/lib/libvirt exists
  ansible.builtin.stat:
    path: /var/lib/libvirt
  register: libvirt_dir_data

- name: Output stat about /var/lib/libvirt
  ansible.builtin.debug:
    msg: '{{ libvirt_dir_data }}'
    verbosity: 1

- name: Create /var/lib/libvirt directory
  ansible.builtin.file:
    path: /var/lib/libvirt
    state: directory
    attributes: +C
    mode: '0755'
    owner: root
    group: root
  become: true

- name: Ensure iptables is not installed
  community.general.pacman:
    name: iptables
    state: absent
    force: true
  become: true

- name: Install iptables-nft
  community.general.pacman:
    name: iptables-nft
    state: present
  become: true

- name: Install libvirt and dependencies
  community.general.pacman:
    name:
      - libvirt
      - dmidecode       # NAT/DHCP networking
      - dnsmasq         # NAT/DHCP networking
      - iptables-nft    # NAT/DHCP networking
      - bridge-utils    # bridged networking
      - openbsd-netcat  # ssh remote management
  become: true

- name: Install QEMU
  community.general.pacman:
    name: qemu-full
    state: present
  become: true

- name: Add user to libvirt group
  ansible.builtin.user:
    name: '{{ libvirt_user }}'
    groups: libvirt
    append: true
  become: true

- name: Start and enable libvirtd.service
  ansible.builtin.systemd:
    name: libvirtd.service
    enabled: true
    state: started
  become: true

- name: Template libvirt-guests
  ansible.builtin.template:
    src: libvirt-guests.j2
    dest: /etc/conf.d/libvirt-guests
    owner: root
    group: root
    mode: '0644'
  become: true
  notify:
    - Restart libvirt-guests

- name: Start and enable libvirt-guests
  ansible.builtin.systemd:
    name: libvirt-guests.service
    enabled: true
    state: started
  become: true

# End of file
