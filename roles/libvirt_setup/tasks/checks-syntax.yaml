---
# tasks file for libvirt_setup

- name: Check public role variable syntax
  ansible.builtin.assert:
    that:
      # libvirt_setup_data_dir_set_nocow is a boolean
      - libvirt_setup_data_dir_set_nocow is defined
      - libvirt_setup_data_dir_set_nocow is not none
      - libvirt_setup_data_dir_set_nocow is boolean

      # libvirt_setup_mgm_users is a list
      - libvirt_setup_mgm_users is defined
      - libvirt_setup_mgm_users is not none
      - libvirt_setup_mgm_users is not string
      - libvirt_setup_mgm_users is not mapping
      - libvirt_setup_mgm_users is iterable

      # libvirt_setup_guests_BYPASS_CACHE is a number
      - libvirt_setup_guests_BYPASS_CACHE is defined
      - libvirt_setup_guests_BYPASS_CACHE is not none
      - libvirt_setup_guests_BYPASS_CACHE is number

      # libvirt_setup_guests_ON_BOOT is a string
      - libvirt_setup_guests_ON_BOOT is defined
      - libvirt_setup_guests_ON_BOOT is not none
      - libvirt_setup_guests_ON_BOOT is string
      - libvirt_setup_guests_ON_BOOT | length > 0
      - libvirt_setup_guests_ON_BOOT in ["ignore", "start"]

      # libvirt_setup_guests_ON_SHUTDOWN is a string
      - libvirt_setup_guests_ON_SHUTDOWN is defined
      - libvirt_setup_guests_ON_SHUTDOWN is not none
      - libvirt_setup_guests_ON_SHUTDOWN is string
      - libvirt_setup_guests_ON_SHUTDOWN | length > 0
      - libvirt_setup_guests_ON_SHUTDOWN in ["shutdown", "suspend"]

      # libvirt_setup_guests_PARALLEL_SHUTDOWN is a number
      - libvirt_setup_guests_PARALLEL_SHUTDOWN is defined
      - libvirt_setup_guests_PARALLEL_SHUTDOWN is not none
      - libvirt_setup_guests_PARALLEL_SHUTDOWN is number

      # libvirt_setup_guests_PERSISTENT_ONLY is a string
      - libvirt_setup_guests_PERSISTENT_ONLY is defined
      - libvirt_setup_guests_PERSISTENT_ONLY is not none
      - libvirt_setup_guests_PERSISTENT_ONLY is string
      - libvirt_setup_guests_PERSISTENT_ONLY | length > 0
      - libvirt_setup_guests_PERSISTENT_ONLY in ["default", "true", "false"]

      # libvirt_setup_guests_SHUTDOWN_TIMEOUT is a number
      - libvirt_setup_guests_SHUTDOWN_TIMEOUT is defined
      - libvirt_setup_guests_SHUTDOWN_TIMEOUT is not none
      - libvirt_setup_guests_SHUTDOWN_TIMEOUT is number

      # libvirt_setup_guests_START_DELAY is a number
      - libvirt_setup_guests_START_DELAY is defined
      - libvirt_setup_guests_START_DELAY is not none
      - libvirt_setup_guests_START_DELAY is number

      # libvirt_setup_guests_SYNC_TIME is a number
      - libvirt_setup_guests_SYNC_TIME is defined
      - libvirt_setup_guests_SYNC_TIME is not none
      - libvirt_setup_guests_SYNC_TIME is number
    fail_msg: Public role variable have bad syntax. Check your configuration.
    success_msg: Syntax correct for public role variables.
    quiet: true
  tags:
    - checks
    - checks-syntax

- name: Check libvirt_setup_mgm_users item syntax
  ansible.builtin.assert:
    that:
      # user is a string
      - user is defined
      - user is not none
      - user is string
      - user | length > 0
    fail_msg: >
      Syntax of list 'libvirt_setup_mgm_users' is bad. The items need to be
      strings.
    success_msg: All items in 'libvirt_setup_mgm_users' have correct syntax.
    quiet: true
  loop: "{{ libvirt_setup_mgm_users }}"
  loop_control:
    loop_var: user
  tags:
    - checks
    - checks-syntax

- name: Check internal role variable syntax
  ansible.builtin.assert:
    that:
      # libvirt_setup_libvirt_data_dir is a string
      - libvirt_setup_libvirt_data_dir is defined
      - libvirt_setup_libvirt_data_dir is not none
      - libvirt_setup_libvirt_data_dir is string
      - libvirt_setup_libvirt_data_dir | length > 0
    fail_msg: >
      Syntax of internal role variables is bad. This is properly a bug. Consult
      the role developer(s).
    success_msg: Internal role variables have corrent syntax.
    quiet: true
  tags:
    - checks
    - checks-syntax

# End of file
