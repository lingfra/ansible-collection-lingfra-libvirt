---
# defaults file for libvirt_setup

# ---------- libvirt configuration ----------

# libvirt_setup: Whether nocow attr should be set on libvirt data dir or not.
libvirt_setup_data_dir_set_nocow: true

# libvirt_setup: List of users, which should be allowed to manage libvirt. Will
# be added to `libvirt` group.
libvirt_setup_mgm_users: []

# ---------- libvirt-guests ----------

# libvirt_setup: Whether a restart of libvirt-guests.service is allowed or not.
libvirt_setup_guests_service_allow_restart: false

# libvirt_setup: Configuration parameters for libvirt-guests configuration file.
# Refer to libvirt-guests(8) for explanation of values.
libvirt_setup_guests_BYPASS_CACHE: null
libvirt_setup_guests_ON_BOOT: null
libvirt_setup_guests_ON_SHUTDOWN: null
libvirt_setup_guests_PARALLEL_SHUTDOWN: null
libvirt_setup_guests_PERSISTENT_ONLY: null
libvirt_setup_guests_SHUTDOWN_TIMEOUT: null
libvirt_setup_guests_START_DELAY: null
libvirt_setup_guests_SYNC_TIME: null

# End of file
