---
# defaults file for libvirt

# libvirt: configuration parameters for libvirt-guests configuration file.
# Refer to libvirt-guests(8) for explanation of values.
libvirt_guests_BYPASS_CACHE: 0
libvirt_guests_ON_BOOT: "start"
libvirt_guests_ON_SHUTDOWN: suspend
libvirt_guests_PARALLEL_SHUTDOWN: 0
libvirt_guests_PERSISTENT_ONLY: 0
libvirt_guests_SHUTDOWN_TIMEOUT: 300
libvirt_guests_START_DELAY: 0
libvirt_guests_SYNC_TIME: 0

# End of file
