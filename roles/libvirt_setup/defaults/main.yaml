---
# defaults file for libvirt_setup

# libvirt_setup: configuration parameters for libvirt-guests configuration file.
# Refer to libvirt-guests(8) for explanation of values.
libvirt_setup_guests_BYPASS_CACHE: 0
libvirt_setup_guests_ON_BOOT: "start"
libvirt_setup_guests_ON_SHUTDOWN: suspend
libvirt_setup_guests_PARALLEL_SHUTDOWN: 0
libvirt_setup_guests_PERSISTENT_ONLY: 0
libvirt_setup_guests_SHUTDOWN_TIMEOUT: 300
libvirt_setup_guests_START_DELAY: 0
libvirt_setup_guests_SYNC_TIME: 0

# End of file
