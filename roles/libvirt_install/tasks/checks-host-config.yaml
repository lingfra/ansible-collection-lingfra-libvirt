---
# tasks file for libvirt_install

- name: Get user database
  ansible.builtin.getent:
    database: passwd
  tags:
    - checks
    - checks-host-config

- name: Check that libvirt management user(s) exist
  ansible.builtin.assert:
    that:
      # user must be an existing user
      - (user is undefined) or (user in getent_passwd.keys())
    fail_msg: >
      The configured user '{{ user }}' in list 'libvirt_install_mgm_users' does
      not exist. Create it or choose another user.
    success_msg: All configured user(s) are present.
    quiet: true
  loop: "{{ libvirt_install_mgm_users }}"
  loop_control:
    loop_var: user
  tags:
    - checks
    - checks-host-config

# End of file
