---
# tasks file for libvirt_install

- name: Create libvirt data directory
  ansible.builtin.file:
    path: "{{ libvirt_install_libvirt_data_dir }}"
    state: directory
    attributes: "{{ '+C' if libvirt_install_data_dir_set_nocow else omit }}"
    mode: "0755"
    owner: root
    group: root
  become: true
  diff: true

- name: Ensure conflicting packages are not installed
  ansible.builtin.package:
    name: "{{ libvirt_install_pkgs_absent }}"
    state: absent
    force: true
  become: true

- name: Install libvirt and dependencies
  ansible.builtin.package:
    name: "{{ libvirt_install_pkgs_present }}"
    state: present
  become: true

- name: Add management users to libvirt group
  ansible.builtin.user:
    name: "{{ user }}"
    groups: libvirt
    append: true
  become: true
  loop: "{{ libvirt_install_libvirt_group_users }}"
  loop_control:
    loop_var: user

- name: Start and enable libvirtd.service
  ansible.builtin.systemd:
    name: libvirtd.service
    enabled: true
    state: started
  become: true
  ignore_errors: "{{ ansible_check_mode }}"

# End of file
