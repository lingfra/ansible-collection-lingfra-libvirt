---
# tasks file for libvirt_install

- name: "Include OS specific variables for libvirt_install"
  ansible.builtin.include_vars:
    file: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yaml"
        - "{{ ansible_distribution }}.yaml"
      paths:
        - "vars"
  tags:
    - always

# ---------- Argument Syntax Checks ----------

- name: "Validate (check) internal variables"
  ansible.builtin.validate_argument_spec:
    argument_spec: "{{ (lookup('ansible.builtin.file', 'meta/argument_specs.yaml')
        | from_yaml)['argument_specs']['internal']['options'] }}"
  tags:
    - checks
    - checks-syntax

- name: "Validate (check) host specific internal variables"
  ansible.builtin.validate_argument_spec:
    argument_spec: "{{ (lookup('ansible.builtin.file', 'meta/argument_specs.yaml')
        | from_yaml)['argument_specs']['internal_os']['options'] }}"
  tags:
    - checks
    - checks-syntax-os

# ---------- Host Configuration Checks ----------

- name: Get user database
  ansible.builtin.getent:
    database: passwd
  tags:
    - checks
    - checks-host-config

- name: Check that libvirt management user(s) exist
  ansible.builtin.assert:
    that:
      # user must be an existing user
      - (user is undefined) or (user in getent_passwd.keys())
    fail_msg: >
      The configured user '{{ user }}' in list 'libvirt_install_mgm_users' does
      not exist. Create it or choose another user.
    success_msg: All configured user(s) are present.
    quiet: true
  loop: "{{ libvirt_install_mgm_users }}"
  loop_control:
    loop_var: user
  tags:
    - checks
    - checks-host-config

- name: Stat libvirt data dir
  ansible.builtin.stat:
    path: "{{ libvirt_install_libvirt_data_dir }}"
  register: libvirt_install_libvirt_data_dir_stat
  tags:
    - checks
    - checks-host-config

- name: Fail if libvirt data dir exists without 'nocow' attribute set
  ansible.builtin.fail:
    msg: >
      {{ libvirt_install_libvirt_data_dir }} need to have the 'nocow' attribute
      set on filesystems with Copy-on-Write feature, to mitigate performance
      issues. If you are sure you do not need the 'nocow' attribute, you can
      disable this check by setting 'libvirt_install_data_dir_check_nocow' to
      false.
  when:
    - libvirt_install_data_dir_set_nocow
    - data_dir.exists
    - '"nocow" not in data_dir.attributes'
  vars:
    # variable for readability
    data_dir: "{{ libvirt_install_libvirt_data_dir_stat.stat }}"
  tags:
    - checks
    - checks-host-config

# ---------- Configure ----------

- name: Include tasks for configuration
  ansible.builtin.include_tasks:
    file: configure.yaml
    apply:
      tags:
        - configure
  tags:
    - configure

# End of file
