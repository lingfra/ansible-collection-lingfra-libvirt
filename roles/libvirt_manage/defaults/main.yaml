---
# defaults file for libvirt_manage

# libvirt_manage: Image file for install VM
libvirt_manage_install_image: null

# libvirt_manage: Amount of memory in MiB.
libvirt_manage_memory: 2048

# libvirt_manage: Specification of the network, which the VM should be attached to.
libvirt_manage_net:
  # Name of the network or bridge.
  name: default
  # Supported types are `network` (virtual host based) and `bridge`.
  type: network

# libvirt_manage: Name of the storage pool, where the VM stores its image(s).
libvirt_manage_storage_pool: default

# libvirt_manage: Count of virtual CPUs for the VM.
libvirt_manage_vcpu_count: 2

# libvirt_manage: List of VMs (libvirt domains).
libvirt_manage_vm_list: []

# libvirt_manage: Size of the new virtual disk in Gigabyte.
libvirt_manage_virtual_disk_size: 20

# End of file
