---
# tasks file for libvirt_manage

- name: Check public role variable syntax
  ansible.builtin.assert:
    that:
      # libvirt_manage_install_image is a string
      - libvirt_manage_install_image is defined
      - libvirt_manage_install_image is not none
      - libvirt_manage_install_image is string
      - libvirt_manage_install_image | length > 0

      # libvirt_manage_memory is a number
      - libvirt_manage_memory is defined
      - libvirt_manage_memory is not none
      - libvirt_manage_memory is number

      # libvirt_manage_net is a mapping
      - libvirt_manage_net is defined
      - libvirt_manage_net is not none
      - libvirt_manage_net is mapping

      # libvirt_manage_net.name is a string
      - libvirt_manage_net.name is defined
      - libvirt_manage_net.name is not none
      - libvirt_manage_net.name is string
      - libvirt_manage_net.name | length > 0

      # libvirt_manage_net.type is a string
      - libvirt_manage_net.type is defined
      - libvirt_manage_net.type is not none
      - libvirt_manage_net.type is string
      - libvirt_manage_net.type | length > 0
      - libvirt_manage_net.type in ["network", "bridge"]

      # libvirt_manage_storage_pool is a string
      - libvirt_manage_storage_pool is defined
      - libvirt_manage_storage_pool is not none
      - libvirt_manage_storage_pool is string
      - libvirt_manage_storage_pool | length > 0

      # libvirt_manage_vcpu_count is a number
      - libvirt_manage_vcpu_count is defined
      - libvirt_manage_vcpu_count is not none
      - libvirt_manage_vcpu_count is number

      # libvirt_manage_virtual_disk_size is a number
      - libvirt_manage_virtual_disk_size is defined
      - libvirt_manage_virtual_disk_size is not none
      - libvirt_manage_virtual_disk_size is number
      - libvirt_manage_virtual_disk_size > 0
    fail_msg: Syntax of public role variables is wrong.
    success_msg: Syntax of public role variables is correct.
    quiet: true

- name: Check libvirt_manage_vm_list syntax
  ansible.builtin.assert:
    that:
      # vm.name is a string
      - vm.name is defined
      - vm.name is not none
      - vm.name is string
      - vm.name | length > 0

      # vm.disk_size is a number
      - (vm.disk_size is not defined) or (vm.disk_size is not none)
      - (vm.disk_size is not defined) or (vm.disk_size is number)
      - (vm.disk_size is not defined) or (vm.disk_size > 0)

      # vm.memory is a number
      - (vm.memory is not defined) or (vm.memory is not none)
      - (vm.memory is not defined) or (vm.memory is number)
      - (vm.memory is not defined) or (vm.memory >= 256)

      # vm.net is a string
      - (vm.net is not defined) or (vm.net is not none)
      - (vm.net is not defined) or (vm.net is mapping)
      - (vm.net is not defined) or (vm.net | length > 0)

      # vm.net.name is a string
      - (vm.net is not defined) or (vm.net.name is defined)
      - (vm.net is not defined) or (vm.net.name is not none)
      - (vm.net is not defined) or (vm.net.name is string)
      - (vm.net is not defined) or (vm.net.name | length > 0)

      # vm.net.type is a string
      - (vm.net is not defined) or (vm.net.type is defined)
      - (vm.net is not defined) or (vm.net.type is not none)
      - (vm.net is not defined) or (vm.net.type is string)
      - (vm.net is not defined) or (vm.net.type | length > 0)
      - (vm.net is not defined) or (vm.net.type in ["network", "bridge"])

      # vm.storage_pool is a string
      - (vm.storage_pool is not defined) or (vm.storage_pool is not none)
      - (vm.storage_pool is not defined) or (vm.storage_pool is string)
      - (vm.storage_pool is not defined) or (vm.storage_pool | length > 0)

      # vm.vcpu_count is a number
      - (vm.vcpu_count is not defined) or (vm.vcpu_count is not none)
      - (vm.vcpu_count is not defined) or (vm.vcpu_count is number)
      - (vm.vcpu_count is not defined) or (vm.vcpu_count > 0)
      - (vm.vcpu_count is not defined) or (vm.vcpu_count < 256)
    fail_msg: |
      VM specification is faulty, ensure you have the following variables with
      the correct data types specified:

        - name (string, mandatory)

        - disk_size (number, optional)
        - memory (number, optional)
        - net (mapping, optional)
        - storage_pool (string, optional)
        - vcpu_count (number, optional)

      Consult the documentation for a detailled description.
    success_msg: VM list has correct syntax.
    quiet: true
  loop: "{{ libvirt_manage_vm_list }}"
  loop_control:
    loop_var: vm

# ---------- Storage Pool ----------

- name: Gather facts about storage pools
  community.libvirt.virt_pool:
    command: facts
  become: true

- name: "Print formatted storage pool facts"
  ansible.builtin.debug:
    var: ansible_facts['libvirt_pools']
    verbosity: 2

- name: Include checks for storage pool
  ansible.builtin.include_tasks:
    file: checks-storage-pool.yaml

- name: Set fact libvirt_manage_storage_pool_path
  ansible.builtin.set_fact:
    libvirt_manage_storage_pool_path: "{{ ansible_facts['libvirt_pools'][libvirt_manage_storage_pool]['path'] }}"

# ---------- Network ----------

- name: Gather facts about libvirt networks
  community.libvirt.virt_net:
    command: facts
  become: true

- name: "Print formatted libvirt networks facts"
  ansible.builtin.debug:
    var: ansible_facts['libvirt_networks']
    verbosity: 2

- name: Include checks for libvirt networks
  ansible.builtin.include_tasks:
    file: checks-libvirt-networks.yaml
  when:
    - libvirt_manage_net.type == 'network'

# ---------- libvirt Domain Existence ----------

- name: Get domain list
  community.libvirt.virt:
    command: list_vms
  become: true
  register: existing_vms
  changed_when: false

- name: "Print formatted domain list"
  ansible.builtin.debug:
    var: existing_vms
    verbosity: 2

# ---------- Install Disk Existence ----------

- name: Set fact libvirt_manage_install_image_full_path
  ansible.builtin.set_fact:
    libvirt_manage_install_image_full_path: "{{ libvirt_manage_storage_pool_path }}/{{ libvirt_manage_install_image }}"

- name: Stat libvirt_manage_install_image_full_path
  ansible.builtin.stat:
    path: "{{ libvirt_manage_install_image_full_path }}"
  register: libvirt_manage_install_image_full_path_info

- name: Check that install image exists
  ansible.builtin.assert:
    that:
      - libvirt_manage_install_image_full_path_info.stat.exists
    fail_msg: Install image does not exist.
    success_msg: Install image present.
    quiet: true

# ---------- VM Creation List ----------

- name: Initilize empty libvirt_manage_vm_list_create
  ansible.builtin.set_fact:
    libvirt_manage_vm_list_create: []

- name: Set fact libvirt_manage_vm_list_create
  ansible.builtin.set_fact:
    libvirt_manage_vm_list_create:
      "{{ libvirt_manage_vm_list_create +
        [{
          'name': vm.name,
          'disk_size': vm_disk_size,
          'memory': vm_memory,
          'net': vm_net,
          'vcpu_count': vm_vcpu_count,
          'virtual_disk_full_path': vm_virtual_disk_full_path,
        }]
      }}"
  loop: "{{ libvirt_manage_vm_list }}"
  loop_control:
    loop_var: vm
    label: "{{ vm.name }}"
  vars:
    vm_disk_size: "{{ vm.disk_size | default(libvirt_manage_virtual_disk_size) }}"
    vm_memory: "{{ vm.memory | default(libvirt_manage_memory) }}"
    vm_net: "{{ vm.net | default(libvirt_manage_net) }}"
    vm_vcpu_count: "{{ vm.vcpu_count | default(libvirt_manage_vcpu_count) }}"
    vm_virtual_disk_full_path: "{{ libvirt_manage_storage_pool_path }}/{{ vm.name }}.qcow2"
  when:
    - vm.name not in existing_vms.list_vms

- name: Include checks for virtual disks
  ansible.builtin.include_tasks:
    file: checks-virtual-disks.yaml
  loop: "{{ libvirt_manage_vm_list_create }}"
  loop_control:
    loop_var: vm

# ---------- Create VMs ----------

- name: Include tasks create-vm.yaml
  ansible.builtin.include_tasks:
    file: create-vm.yaml
  loop: "{{ libvirt_manage_vm_list_create }}"
  loop_control:
    loop_var: vm
    label: "{{ vm.name }}"

# End of file
