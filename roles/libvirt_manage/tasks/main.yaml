---
# tasks file for libvirtdom

- name: Check public role variable syntax
  ansible.builtin.assert:
    that:
      # libvirtdom_install_image is a string
      - libvirtdom_install_image is defined
      - libvirtdom_install_image is not none
      - libvirtdom_install_image is string
      - libvirtdom_install_image | length > 0

      # libvirtdom_memory is a number
      - libvirtdom_memory is defined
      - libvirtdom_memory is not none
      - libvirtdom_memory is number

      # libvirtdom_net is a string
      - libvirtdom_net is defined
      - libvirtdom_net is not none
      - libvirtdom_net is string
      - libvirtdom_net | length > 0

      # libvirtdom_storage_pool is a string
      - libvirtdom_storage_pool is defined
      - libvirtdom_storage_pool is not none
      - libvirtdom_storage_pool is string
      - libvirtdom_storage_pool | length > 0

      # libvirtdom_vcpu_count is a number
      - libvirtdom_vcpu_count is defined
      - libvirtdom_vcpu_count is not none
      - libvirtdom_vcpu_count is number

      # libvirtdom_virtual_disk_size is a number
      - libvirtdom_virtual_disk_size is defined
      - libvirtdom_virtual_disk_size is not none
      - libvirtdom_virtual_disk_size is number
      - libvirtdom_virtual_disk_size > 0

      # libvirtdom_vm_name is a string
      - libvirtdom_vm_name is defined
      - libvirtdom_vm_name is not none
      - libvirtdom_vm_name is string
      - libvirtdom_vm_name | length > 0
    fail_msg: Syntax of public role variables is wrong.
    success_msg: Syntax of public role variables is correct.
    quiet: true

# ---------- Storage Pool ----------

- name: Gather facts about storage pools
  community.libvirt.virt_pool:
    command: facts

- name: "Print formatted storage pool facts"
  ansible.builtin.debug:
    var: ansible_facts['libvirt_pools']
    verbosity: 2

- name: Include checks for storage pool
  ansible.builtin.include_tasks:
    file: checks-storage-pool.yaml

- name: Set fact libvirtdom_storage_pool_path
  ansible.builtin.set_fact:
    libvirtdom_storage_pool_path: "{{ ansible_facts['libvirt_pools'][libvirtdom_storage_pool]['path'] }}"

# ---------- Network ----------

- name: Gather facts about libvirt networks
  community.libvirt.virt_net:
    command: facts

- name: "Print formatted libvirt networks facts"
  ansible.builtin.debug:
    var: ansible_facts['libvirt_networks']
    verbosity: 2

- name: Include checks for libvirt networks
  ansible.builtin.include_tasks:
    file: checks-libvirt-networks.yaml

# ---------- libvirt Domain Existence ----------

- name: Get domain list
  community.libvirt.virt:
    command: list_vms
  register: existing_vms
  changed_when: false

- name: "Print formatted domain list"
  ansible.builtin.debug:
    var: existing_vms
    verbosity: 2

- name: Check that vm (libvirt domain) does not exist
  ansible.builtin.assert:
    that:
      - libvirtdom_vm_name not in existing_vms.list_vms
    fail_msg: VM already exists. Choose another name or delete existing VM.
    success_msg: All assertions passed.
    quiet: true

# ---------- Virtual Disk Existence ----------

- name: Set facts for image full paths
  ansible.builtin.set_fact:
    libvirtdom_virtual_disk_full_path: "{{ libvirtdom_storage_pool_path }}/{{ libvirtdom_vm_name }}.qcow2"
    libvirtdom_install_image_full_path: "{{ libvirtdom_storage_pool_path }}/{{ libvirtdom_install_image }}"

- name: Stat libvirtdom_install_image_full_path
  ansible.builtin.stat:
    path: "{{ libvirtdom_install_image_full_path }}"
  register: libvirtdom_install_image_full_path_info

- name: Check that install image exists
  ansible.builtin.assert:
    that:
      - libvirtdom_install_image_full_path_info.stat.exists
    fail_msg: Install image does not exist.
    success_msg: Install image present.
    quiet: true

- name: Stat libvirtdom_virtual_disk_full_path
  ansible.builtin.stat:
    path: "{{ libvirtdom_virtual_disk_full_path }}"
  register: libvirtdom_virtual_disk_full_path_info

- name: Check that virtual disk not already exists
  ansible.builtin.assert:
    that:
      - not libvirtdom_virtual_disk_full_path_info.stat.exists
    fail_msg: Virtual disk already exists! Delete or rename the existing disk or choose another name for the VM.
    success_msg: Virtual disk does not exist.
    quiet: true

# ---------- Configuration ----------

- name: Create virtual disk
  ansible.builtin.command:
    cmd: qemu-img create -f qcow2 -o preallocation=metadata {{ libvirtdom_virtual_disk_full_path }} {{ libvirtdom_virtual_disk_size }}G
  become: true
  changed_when: true

- name: Define libvirt domain
  community.libvirt.virt:
    command: define
    xml: "{{ lookup('template', 'vm.xml.j2') }}"

# End of file
