---
# tasks file for role name

- name: "Check existence of libvirt network: '{{ vm.net.name }}'"
  ansible.builtin.assert:
    that:
      - net_name in ansible_facts['libvirt_networks']
    fail_msg: >
      Virtual network '{{ vm.net.name }}' does not exist on {{ inventory_hostname }}.
    success_msg: >
      Virtual network '{{ vm.net.name }}' on {{ inventory_hostname }} found.
    quiet: true
  vars:
    net_name: "{{ vm.net.name }}"

- name: "Check status of libvirt network: '{{ vm.net.name }}'"
  ansible.builtin.assert:
    that:
      - network['persistent'] == "yes"
      - network['state'] == "active"
    fail_msg: >
      Virtual network '{{ vm.net.name }}' need to be persistent and active.
    success_msg: >
      Virtual network '{{ vm.net.name }}' is in good state.
    quiet: false
  vars:
    network: "{{ ansible_facts['libvirt_networks'][vm.net.name] }}"

# End of file
